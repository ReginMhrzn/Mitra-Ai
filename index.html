<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mitra Ai — Launching Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Poppins',sans-serif}
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .25s ease-out}
</style>
</head>
<body class="min-h-screen bg-white text-neutral-900 antialiased overflow-x-hidden">

<main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col items-center justify-between px-5 pt-10 text-center sm:px-8">

  <div class="flex w-full flex-1 flex-col items-center justify-center">

    <img src="logo.png" alt="Mitra Ai"
         class="mx-auto w-full max-w-[18rem] sm:max-w-md lg:max-w-lg"
         onerror="this.style.display='none'">

    <h1 class="mt-8 text-4xl font-extrabold leading-tight tracking-tight sm:text-6xl lg:text-7xl">
      Launching <span class="text-blue-600">Soon</span>
    </h1>

    <p class="mt-4 max-w-xl text-base text-neutral-600 sm:text-xl">
      Mitra Ai is a Nepali AI, built in Nepal, for everyone. Be the first to know when we go live.
    </p>

    <div class="mt-10 flex flex-col items-center gap-3 sm:flex-row sm:justify-center">
      <button id="joinBtn" type="button"
        class="rounded-full bg-blue-600 px-8 py-3.5 font-semibold text-white shadow-lg shadow-blue-600/20 transition hover:bg-blue-700 active:scale-95">
        Join the waitlist
      </button>
      <button id="learnBtn" type="button"
        class="rounded-full border border-neutral-300 bg-white px-6 py-3.5 font-medium text-neutral-700 transition hover:border-blue-400 hover:text-blue-600 active:scale-95">
        Learn more
      </button>
    </div>

    <p id="who" class="mt-4 text-xs text-neutral-500" style="display:none">
      Joined as <span id="whoName" class="font-semibold text-neutral-700"></span> ·
      <button id="signout" type="button" class="text-blue-600 underline">Not you?</button>
    </p>

  </div>

  <footer class="mt-12 flex w-full justify-center border-t border-neutral-200 py-6">
    <button id="devBtn" type="button"
      class="group inline-flex items-center gap-3 rounded-full border border-neutral-200 bg-white py-2 pl-2 pr-5 shadow-sm transition hover:border-blue-300 hover:shadow-md active:scale-95">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-blue-600 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             class="h-5 w-5">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
      </span>
      <span class="text-left leading-tight">
        <span class="block text-sm font-semibold text-neutral-800">Meet the developer</span>
        <span class="block text-xs text-neutral-500">Regin Maharjan — AI Developer</span>
      </span>
      <span class="text-blue-600 transition group-hover:translate-x-1">&rarr;</span>
    </button>
  </footer>

</main>

<script>
/* ============================================================
   PASTE YOUR WEB3FORMS ACCESS KEY BELOW
   Example: var ACCESS_KEY = "a1b2c3d4-e5f6-7890-abcd-ef1234567890";
   ============================================================ */
var ACCESS_KEY = "PASTE_YOUR_ACCESS_KEY_HERE";

var STORE_KEY = "mitra_user";
function $(id){ return document.getElementById(id); }

function getUser(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ return null; }
}
function saveUser(u){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(u)); } catch(e){}
}
function clearUser(){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
}

var toastEl = document.createElement("div");
toastEl.style.cssText =
  "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;z-index:10000;" +
  "background:#111827;color:#fff;padding:12px 20px;border-radius:9999px;font-size:14px;" +
  "font-family:'Poppins',sans-serif;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);";
document.body.appendChild(toastEl);

function toast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toastEl.style.display = "none"; }, 4000);
}

var overlay = document.createElement("div");
overlay.style.cssText =
  "position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:none;align-items:center;" +
  "justify-content:center;padding:20px;background:rgba(15,23,42,.55);font-family:'Poppins',sans-serif;";

overlay.innerHTML = `
  <div class="pop" style="position:relative;width:100%;max-width:400px;background:#fff;border-radius:24px;
       padding:28px 24px;box-shadow:0 25px 60px rgba(0,0,0,.3);text-align:left;">
    <button id="closeBtn" type="button" aria-label="Close"
      style="position:absolute;right:16px;top:10px;font-size:28px;line-height:1;color:#9ca3af;
             background:none;border:none;cursor:pointer;">&times;</button>

    <h2 style="font-size:24px;font-weight:700;margin:0;">
      Join <span style="color:#0b5cff;">Mitra Ai</span>
    </h2>
    <p style="margin:6px 0 0;font-size:14px;color:#6b7280;">
      Get notified when we launch. No spam, we promise.
    </p>

    <form id="signupForm"
          style="margin-top:20px;display:flex;flex-direction:column;gap:12px;">

      <input id="nameInput" name="name" type="text" required placeholder="Your name"
        autocomplete="name"
        style="width:100%;box-sizing:border-box;padding:12px 16px;border:1px solid #d1d5db;
               border-radius:12px;font-size:16px;font-family:inherit;outline:none;">

      <input id="emailInput" name="email" type="email" required placeholder="Your email"
        autocomplete="email"
        style="width:100%;box-sizing:border-box;padding:12px 16px;border:1px solid #d1d5db;
               border-radius:12px;font-size:16px;font-family:inherit;outline:none;">

      <button id="signupBtn" type="submit"
        style="width:100%;padding:12px;border:none;border-radius:12px;background:#0b5cff;
               color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;">
        Join waitlist
      </button>
    </form>

    <p id="formMsg"
       style="margin:12px 0 0;min-height:20px;text-align:center;font-size:14px;
              font-weight:500;color:#dc2626;"></p>
  </div>
`;
document.body.appendChild(overlay);

function openModal(){
  overlay.style.display = "flex";
  setTimeout(function(){ $("nameInput").focus(); }, 50);
}
function closeModal(){
  overlay.style.display = "none";
  $("formMsg").textContent = "";
}

function showThankYou(name){
  var box = document.createElement("div");
  box.style.cssText =
    "position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;display:flex;align-items:center;" +
    "justify-content:center;padding:20px;background:rgba(15,23,42,.55);font-family:'Poppins',sans-serif;";

  box.innerHTML = `
    <div class="pop" style="width:100%;max-width:400px;background:#fff;border-radius:24px;
         padding:32px 24px;box-shadow:0 25px 60px rgba(0,0,0,.3);text-align:center;">
      <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:9999px;
                  background:#dcfce7;color:#16a34a;font-size:34px;line-height:64px;">&#10003;</div>
      <h2 style="font-size:22px;font-weight:700;margin:0;">
        Thank you, <span style="color:#0b5cff;"></span>!
      </h2>
      <p style="margin:12px 0 0;font-size:15px;color:#4b5563;line-height:1.6;">
        Mitra Ai is a Nepali AI launching soon.<br>
        We'll notify you the moment we go live!
      </p>
      <button type="button" class="nclose"
        style="margin-top:22px;width:100%;padding:12px;border:none;border-radius:12px;
               background:#0b5cff;color:#fff;font-size:16px;font-weight:600;
               font-family:inherit;cursor:pointer;">
        Got it
      </button>
    </div>
  `;
  box.querySelector("span").textContent = name;

  function close(){ if(box.parentNode) box.parentNode.removeChild(box); }
  box.querySelector(".nclose").addEventListener("click", close);
  box.addEventListener("click", function(e){ if(e.target === box) close(); });
  document.body.appendChild(box);
}

function showAbout(){
  var box = document.createElement("div");
  box.style.cssText =
    "position:fixed;top:0;left:0;right:0;bottom:0;z-index:10001;display:flex;align-items:center;" +
    "justify-content:center;padding:20px;background:rgba(15,23,42,.55);font-family:'Poppins',sans-serif;";

  box.innerHTML = `
    <div class="pop" style="position:relative;width:100%;max-width:400px;background:#fff;
         border-radius:24px;padding:32px 24px;box-shadow:0 25px 60px rgba(0,0,0,.3);text-align:center;">
      <button type="button" class="aclose" aria-label="Close"
        style="position:absolute;right:16px;top:10px;font-size:28px;line-height:1;
               color:#9ca3af;background:none;border:none;cursor:pointer;">&times;</button>
      <h2 style="font-size:24px;font-weight:700;margin:0;">
        What is <span style="color:#0b5cff;">Mitra Ai</span>?
      </h2>
      <p style="margin:14px 0 0;font-size:15px;color:#4b5563;line-height:1.7;">
        Mitra Ai is a Nepali AI that can solve problems. It helps you learn, create
        and get things done with simple and smart answers. Made in Nepal, for everyone.
      </p>
      <div style="margin:22px 0 0;padding-top:18px;border-top:1px solid #e5e7eb;">
        <p style="margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9ca3af;">
          Developer
        </p>
        <p style="margin:6px 0 0;font-size:16px;font-weight:600;color:#111827;">
          Regin Maharjan <span style="font-weight:500;color:#0b5cff;">(AI Developer)</span>
        </p>
      </div>
      <button type="button" class="aclose"
        style="margin-top:22px;width:100%;padding:12px;border:none;border-radius:12px;
               background:#0b5cff;color:#fff;font-size:16px;font-weight:600;
               font-family:inherit;cursor:pointer;">
        Close
      </button>
    </div>
  `;
  function close(){ if(box.parentNode) box.parentNode.removeChild(box); }
  var cs = box.querySelectorAll(".aclose");
  for(var i=0;i<cs.length;i++) cs[i].addEventListener("click", close);
  box.addEventListener("click", function(e){ if(e.target === box) close(); });
  document.body.appendChild(box);
}

function refreshButton(){
  var u = getUser();
  if (u) {
    $("joinBtn").textContent = "You're on the list";
    $("whoName").textContent = u.name;
    $("who").style.display = "block";
  } else {
    $("joinBtn").textContent = "Join the waitlist";
    $("who").style.display = "none";
  }
}
refreshButton();

$("signupForm").addEventListener("submit", function(e){
  e.preventDefault();

  var name  = $("nameInput").value.trim();
  var email = $("emailInput").value.trim();
  var b     = $("signupBtn");

  b.disabled = true;
  b.textContent = "Joining...";
  $("formMsg").textContent = "";

  fetch("https://api.web3forms.com/submit", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify({
      access_key: ACCESS_KEY,
      name: name,
      email: email,
      subject: "New Mitra Ai waitlist signup",
      from_name: "Regin Maharjan (AI Developer)",
      replyto: email,
      message: "New signup: " + name + " (" + email + ")"
    })
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (!data.success) {
      throw new Error(data.message || "Something went wrong.");
    }
    saveUser({ name: name, email: email });
    $("signupForm").reset();
    closeModal();
    refreshButton();
    showThankYou(name);
    toast("Welcome aboard, " + name + "!");
  })
  .catch(function(err){
    $("formMsg").textContent = err.message || "Please try again.";
  })
  .then(function(){
    b.disabled = false;
    b.textContent = "Join waitlist";
  });
});

$("joinBtn").addEventListener("click", function(){
  if (getUser()) { toast("You're already on the waitlist"); return; }
  openModal();
});

$("learnBtn").addEventListener("click", showAbout);
$("devBtn").addEventListener("click", showAbout);
$("closeBtn").addEventListener("click", closeModal);

overlay.addEventListener("click", function(e){
  if (e.target === overlay) closeModal();
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") closeModal();
});

$("signout").addEventListener("click", function(){
  clearUser();
  refreshButton();
  toast("Signed out.");
});
</script>

</body>
</html>
